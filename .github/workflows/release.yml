# Push a tag like v1.0.0 to publish binaries (used by scripts/install.sh).
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make dist VERSION=${GITHUB_REF_NAME}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/caddyweb-linux-*
            dist/SHA256SUMS
          generate_release_notes: true
